[package]
name = "shadow-x-pro"
version = "1.0.0"
description = "Shadow X Pro Mouse Configuration Software"
authors = ["Shadow X Pro"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["wry", "shell-open", "dialog-all", "fs-all", "path-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs-next = "2.0"
